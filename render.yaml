# Render blueprint.
#
# Kept in step with what the server actually demands at boot. Production now
# refuses to start on a misconfiguration rather than warning about it, so a
# missing variable here is a failed deploy rather than an instance quietly
# serving patients without transport or at-rest encryption.
#
# `sync: false` means "prompt me for this value, do not store it in the repo".
# Every secret uses it. Nothing sensitive belongs in this file.

services:
  - type: web
    name: healthai-assistant
    env: node
    plan: starter

    # --legacy-peer-deps matches CI and the Railway build. This dependency tree
    # does not resolve under a plain `npm install` on every npm version, and the
    # failure is a confusing peer-dependency wall rather than a clear error.
    buildCommand: npm install --legacy-peer-deps && npm run build
    startCommand: npm start

    healthCheckPath: /api/ready

    envVars:
      - key: NODE_ENV
        value: production

      # --- Hard requirements: the server exits 1 without these ---------------

      # Patient data must not travel over plaintext HTTP. Render terminates TLS
      # at its edge and forwards x-forwarded-proto, so the in-process redirect
      # works correctly here.
      - key: HTTPS_ONLY
        value: true

      # Signs session cookies. Must be at least 64 characters.
      #
      # Deliberately NOT `generateValue: true`: Render's generated value is
      # shorter than the minimum this application enforces, so the deploy would
      # fail at boot with a message about SESSION_SECRET rather than about the
      # blueprint. Generate one and paste it:
      #   npm run secrets
      - key: SESSION_SECRET
        sync: false

      # At-rest encryption for clinical free text. Format is "<id>:<64 hex>",
      # comma-separated for multiple keys. The id is not decoration — it is
      # written into every ciphertext so the key can be rotated later.
      #   npm run secrets
      - key: ENCRYPTION_KEYS
        sync: false
      - key: ENCRYPTION_ACTIVE_KEY_ID
        value: k1

      # --- Database ---------------------------------------------------------

      # Supabase, not a Render database. The `databases:` block that used to sit
      # at the bottom of this file provisioned a second Postgres instance that
      # nothing connected to: DATABASE_URL in .env points at Supabase, so Render
      # would have billed for an empty database while the application talked to
      # a different one.
      - key: DATABASE_URL
        sync: false

      # --- Application ------------------------------------------------------

      # The absolute base URL patients visit. Used to build the "sign in to
      # view" link in notification emails, which is a relative path and
      # therefore useless in an inbox without this.
      - key: PUBLIC_APP_URL
        sync: false

      # --- Integrations, all optional ---------------------------------------
      #
      # Every one of these is reported on /api/ready when absent. The
      # application says what it cannot do rather than pretending.

      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini

      # Email delivery. Requires a domain authenticated in SendGrid: mail sent
      # from an address on a domain you do not control DNS for fails DMARC at
      # the receiving end and is rejected or spam-foldered, whatever SendGrid
      # says about it.
      - key: SENDGRID_API_KEY
        sync: false
      - key: NOTIFICATION_FROM_EMAIL
        sync: false

      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      # A number or an alphanumeric sender id. Falls back to
      # TWILIO_PHONE_NUMBER when unset.
      - key: TWILIO_SMS_NUMBER
        sync: false

      - key: GOOGLE_CALENDAR_CREDENTIALS
        sync: false
      - key: GOOGLE_CALENDAR_ID
        sync: false

      # Private bucket for scan images, and the service account that reaches it.
      #
      # These are now a hard requirement, not a nicety: the server exits 1 on a
      # production start without a reachable object store, because the fallback
      # writes patient imaging to the container filesystem, which on Render does
      # not survive a redeploy. Set ALLOW_EPHEMERAL_SCAN_STORAGE=true only if
      # you have decided to accept losing them.
      - key: GOOGLE_CLOUD_SCAN_BUCKET
        sync: false
      - key: GOOGLE_CLOUD_PROJECT_ID
        sync: false
      - key: GOOGLE_CLOUD_CLIENT_EMAIL
        sync: false
      - key: GOOGLE_CLOUD_PRIVATE_KEY
        sync: false

      # Where the resident-model inference service is listening.
      #
      # Without it, every scan spawns a Python process that imports TensorFlow
      # and loads a ~90 MB model from disk: 8-14 s per scan, and one process per
      # concurrent request with no ceiling. With it, a scan is an HTTP call to
      # a process that already holds both models — roughly 500 ms, behind a
      # bounded queue.
      #
      # Points at the private service defined below.
      - key: INFERENCE_URL
        fromService:
          type: pserv
          name: healthai-inference
          property: hostport

  # The models, held in memory, on their own instance.
  #
  # A private service rather than a second web service: nothing outside the
  # cluster should be able to submit an image for classification, and this has
  # no authentication of its own by design — it is reached only by the web
  # service, which has already authorised the request and checked consent.
  #
  # Sized for memory, not CPU. Two resident ResNet50V2 models plus TensorFlow is
  # roughly 1.5 GB before any request arrives, and inference is serialised
  # behind a lock, so a larger plan buys headroom rather than throughput. Scale
  # this out only after measuring queue depth at /healthz.
  - type: pserv
    name: healthai-inference
    env: python
    plan: standard
    buildCommand: pip install -r requirements.txt -r inference/requirements.txt
    startCommand: uvicorn inference.server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      # The model artifacts are gitignored, so they have to be mounted or
      # fetched onto this instance and these must point at wherever they land.
      # /healthz reports the artifact hash it is actually serving; confirm it
      # matches the model_version values appearing in medical_scans.
      - key: SKIN_CANCER_MODEL_PATH
        sync: false
      - key: LUNG_CANCER_MODEL_PATH
        sync: false
      - key: INFERENCE_MAX_QUEUE_DEPTH
        value: 16
