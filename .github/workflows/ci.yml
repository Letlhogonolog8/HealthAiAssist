name: CI

# The authorization guarantees in tests/auth-matrix.test.ts are the reason this
# exists. They were written after several /api/doctor/* routes were found
# serving patient names, emails and clinical notes to anonymous callers — a
# regression nobody noticed because nothing ran the checks. Guards are easy to
# drop while refactoring and the failure is silent, so the suite has to run on
# every push rather than when someone remembers.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: healthai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/healthai_test
      # Named explicitly as well as through DATABASE_URL. The suite refuses to
      # run destructively against a remote database unless it is pointed at one
      # deliberately; this is the ephemeral service container above, created and
      # destroyed inside the job.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/healthai_test
      # Test-only value. The app requires >= 64 characters and refuses to boot in
      # production without a real one; this database is created and destroyed
      # inside the job and never holds anything.
      SESSION_SECRET: ci_only_not_a_real_secret_0000000000000000000000000000000000000000
      NODE_ENV: development

    steps:
      - uses: actions/checkout@v4

      # 22, not 20: the runners now force Node 20 actions onto 24 and warn, and
      # `node --test` only expands glob patterns itself from 21 onwards, which
      # is what keeps the test script behaving the same here as on a developer
      # machine.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # Matches the install used by the Railway build (railway.json), which is
      # the one configuration known to resolve this dependency tree.
      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build client
        run: npx vite build

      # Schema first, session table second, and the order matters.
      #
      # Creating `session` first left drizzle-kit looking at a database holding
      # exactly one table it did not recognise, so instead of creating the
      # schema it asked whether `appointments` was that table renamed:
      #
      #   Is appointments table created or renamed from another table?
      #   ❯ + appointments           create table
      #     ~ session › appointments rename table
      #
      # --force only auto-approves data-loss statements, not rename
      # disambiguation. The prompt read EOF, the step exited 0, and nothing was
      # created — the failure surfaced much later as 'relation "users" does not
      # exist'. Against an empty database there is nothing to rename from and
      # no question to ask.
      - name: Create application schema
        run: npx drizzle-kit push --force < /dev/null

      # express-session's Postgres store is configured with tableName 'session'
      # and without createTableIfMissing, so the table has to exist before the
      # server boots.
      - name: Create session table
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f node_modules/connect-pg-simple/table.sql

      # A push that silently does nothing must not reach the tests, where it
      # shows up as a hook failure several minutes and one confusing log later.
      - name: Verify schema
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c \
            "SELECT 'users'::regclass, 'medical_scans'::regclass, 'appointments'::regclass, 'audit_events'::regclass, 'chat_messages'::regclass, 'notifications'::regclass, 'session'::regclass;"

      - name: Test
        run: npm test

      # Advisory, not blocking. A transitive advisory with no available fix
      # should be visible in the log without holding up an unrelated change;
      # a blocking audit on a tree this size becomes a step people disable.
      - name: Dependency audit
        run: npm audit --audit-level=high || true
        continue-on-error: true

      # The published figures in MODEL_CARDS.md are only checkable while the
      # evaluation script runs. This does not re-evaluate the models — that
      # needs the artifacts, which are gitignored — but it does catch the script
      # itself breaking, which is how a reproduction command silently stops
      # working.
      - name: Model evaluation script is runnable
        run: |
          python -m py_compile scripts/evaluate-model.py \
            server/skin_cancer_model.py \
            server/lung-cancer-service.py \
            inference/server.py \
            inference/dicom_ingest.py \
            inference/gradcam.py \
            scripts/lidc_build_labels.py \
            scripts/lidc_extract_patches.py \
            scripts/lidc_whole_slices.py \
            scripts/train-lung-nodule-model.py
