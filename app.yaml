runtime: nodejs18

env_variables:
  NODE_ENV: production
  SESSION_SECRET: your-production-session-secret-here
  
automatic_scaling:
  min_instances: 1
  max_instances: 10
  target_cpu_utilization: 0.6

resources:
  cpu: 1
  memory_gb: 2
  disk_size_gb: 10

handlers:
  - url: /api/.*
    script: auto
    secure: always
  
  - url: /.*
    static_files: dist/public/\1
    upload: dist/public/.*
    secure: always

skip_files:
  - ^(.*/)?#.*#$
  - ^(.*/)?.*~$
  - ^(.*/)?.*\.py[co]$
  - ^(.*/)?.*/RCS/.*$
  - ^(.*/)?\..*$
  - ^(.*/)?node_modules/.*$
  - ^(.*/)?venv/.*$